<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>서울현대요양병원 정류장</title>
    <meta name="description" content="서울현대요양병원(25-159) 정류장 실시간 버스 도착 정보" />
    <meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f16" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="25159" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="head">
        <div class="head__row">
          <h1>서울현대요양병원</h1>
          <button class="ars" id="arsBtn" type="button" aria-label="정류장 번호 25159 복사">25159</button>
          <button class="iconbtn" id="settingsBtn" type="button" aria-label="설정 열기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
              <circle cx="12" cy="12" r="3.2" />
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.7 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.7a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.3 9v.09A1.7 1.7 0 0 0 20.86 10H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z" />
            </svg>
          </button>
        </div>
        <p class="head__dir">천호역2번출구 · 현대백화점 방면</p>
      </header>

      <div class="status" id="status" data-state="loading" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span class="status__text" id="statusText">불러오는 중…</span>
        <button class="refresh" id="refreshBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.6 6.9" />
            <path d="M20 5v6h-6" />
          </svg>
          <span>새로고침</span>
        </button>
      </div>

      <div class="banner" id="banner" hidden></div>

      <main>
        <ul class="routes" id="routes" aria-label="노선별 도착 정보"></ul>
      </main>

      <p class="footnote" id="footnote">서울시 버스 도착정보 기준 · 30초마다 자동 새로고침</p>
    </div>

    <footer class="actions">
      <a class="map map--naver" id="naverLink" href="https://map.naver.com/p/bus/bus-station/-/bus-station/109370" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm3.6 4.2v9.6h2.2v-5.1l3.9 5.1H16V7.2h-2.2v5L9.9 7.2H7.6z" />
        </svg>
        네이버지도
      </a>
      <a class="map map--kakao" id="kakaoLink" href="https://map.kakao.com/?busStopId=11250621001" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 3.4c-4.6 0-8.4 2.9-8.4 6.4 0 2.3 1.5 4.3 3.8 5.4l-.9 3.3c-.1.4.3.7.6.5l3.9-2.6c.3 0 .6.1.9.1 4.6 0 8.4-2.9 8.4-6.4S16.6 3.4 12 3.4z" />
        </svg>
        카카오맵
      </a>
      <button class="copy" id="copyBtn" type="button" aria-label="정류장 번호 복사">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="9" y="9" width="11" height="11" rx="2.2" />
          <path d="M15 5.5A2.5 2.5 0 0 0 12.5 3h-6A3.5 3.5 0 0 0 3 6.5v6A2.5 2.5 0 0 0 5.5 15" />
        </svg>
        번호
      </button>
    </footer>

    <div class="sheet" id="settingsSheet" hidden>
      <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <h2 id="sheetTitle">중계 서버 설정</h2>
        <p>
          실시간 도착 정보는 Cloudflare Worker가 서울시 데이터를 대신 받아 옵니다. 배포한 Worker 주소를 넣어 주세요.
          주소는 이 기기에만 저장되고 다른 곳으로 보내지 않습니다.
        </p>
        <label for="apiInput">Worker 주소</label>
        <input
          id="apiInput"
          type="url"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="https://bus-stop-25159.example.workers.dev"
        />
        <p class="sheet__hint" id="sheetHint"></p>
        <div class="sheet__buttons">
          <button type="button" class="ghost" id="sheetClose">닫기</button>
          <button type="button" id="sheetTest">연결 확인</button>
          <button type="button" class="primary" id="sheetSave">저장</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js" defer></script>
  </body>
</html>
